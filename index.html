<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Letrilandia</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#9B8AD9"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><style>@font-face{font-family:"Andika";font-weight:400 700;font-display:swap;src:url(fonts/andika-700-latin.woff2) format("woff2")}@font-face{font-family:"Fredoka";font-weight:300 700;font-display:swap;src:url(fonts/fredoka-latin.woff2) format("woff2")}</style>
<style>
:root{--paper:#FFF6E6;--ink:#4A3428;--lav:#9B8AD9;color-scheme:light}
html,body{margin:0;height:100%;background:#2E2420;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#cv{position:fixed;inset:0;display:block;touch-action:none}
#adult{position:fixed;inset:0;background:rgba(46,36,32,.6);display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:16px;box-sizing:border-box;touch-action:auto;-webkit-user-select:text;user-select:text;font-family:Fredoka,system-ui,sans-serif;color:var(--ink)}
#adult[hidden]{display:none}
#adult .panel{background:var(--paper);border:3px solid var(--ink);border-radius:28px;max-width:760px;width:100%;padding:20px 22px 26px;box-sizing:border-box}
#adult header{display:flex;justify-content:space-between;align-items:center;gap:12px}
#adult h2{margin:0;font-size:28px}#adult h3{margin:0 0 8px;font-size:20px;color:#7E6CC4}
#adult section{border-top:2px dashed #E4D3B8;padding:14px 0 6px}
#adult label{display:block;margin:6px 0}#adult input[type=text],#adult input:not([type]){font:inherit;padding:8px 12px;border:2px solid var(--ink);border-radius:12px;width:100%;max-width:320px;box-sizing:border-box;margin-top:4px;background:#fff}
#adult .row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:6px 0}#adult .row>span{min-width:64px;font-weight:600}
#adult .opt{display:inline-flex;gap:6px;align-items:center;margin:0;background:#fff;border:2px solid #E4D3B8;border-radius:999px;padding:4px 12px}
#adult .rng{display:flex;align-items:center;gap:12px}#adult .rng input{flex:1;max-width:280px}
#adult .note{font-size:14px;color:#7A6252;margin:6px 0}
#adult .tip{background:#FFF0C2;border-radius:14px;padding:10px 14px;font-size:15px}
#adult table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}#adult th,#adult td{text-align:left;padding:6px 8px;border-bottom:1px solid #E4D3B8}
#adult td.lt{font-family:Andika,sans-serif;font-weight:700;font-size:22px}
#adult .pill{border-radius:999px;padding:2px 10px;font-size:13px;background:#EEE}#adult .pAprendida{background:#D6F2CF}#adult .pLecuesta{background:#FFD7D0}#adult .pEncamino{background:#FFF0C2}
#adult button{font:inherit;font-weight:600;border:2px solid var(--ink);background:#fff;border-radius:999px;padding:8px 16px;cursor:pointer}
#adult button:focus-visible,#adult input:focus-visible{outline:3px solid var(--lav);outline-offset:2px}
#adult .danger{background:#FFD7D0}#adult #a-close{background:var(--lav);color:#fff}
#adult .days{display:flex;gap:8px;flex-wrap:wrap}#adult .day{background:#fff;border-radius:12px;padding:6px 10px;text-align:center;font-size:14px}
#adult ul{padding-left:20px;margin:8px 0}
#adult h4{margin:10px 0 4px}#adult details summary{cursor:pointer;font-weight:600;margin:8px 0}
#adult .recs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px}
#adult .rec{display:flex;align-items:center;gap:6px;background:#fff;border:2px solid #E4D3B8;border-radius:14px;padding:4px 8px}
#adult .rec b{font-family:Andika,sans-serif;font-size:20px;min-width:34px}#adult .rec small{flex:1;color:#7A6252;font-size:13px}
#adult .rec.has{border-color:#7CC86E;background:#F1FAEE}#adult .rec.on{border-color:#FF5A5A;background:#FFE9E6}
#adult .rec button{padding:4px 10px;font-size:14px}#adult .rec button:disabled{opacity:.35}
#adult .rec .up{margin:0;border:2px solid var(--ink);border-radius:999px;padding:2px 9px;cursor:pointer;background:#fff;font-weight:600}#adult .rec .up input{display:none}
#nameDlg,#resetDlg{position:fixed;inset:0;background:rgba(46,36,32,.6);display:flex;justify-content:center;align-items:center;padding:16px;font-family:Fredoka,system-ui,sans-serif;color:#4A3428;touch-action:auto}
#nameDlg[hidden],#resetDlg[hidden]{display:none}#nameDlg .panel,#resetDlg .panel{background:#FFF6E6;border:3px solid #4A3428;border-radius:28px;padding:22px;max-width:440px;width:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:14px}
#nameDlg h2,#resetDlg h2{margin:0;font-size:24px}#nameDlg input{font:inherit;font-size:26px;padding:10px 14px;border:2px solid #4A3428;border-radius:14px;-webkit-user-select:text;user-select:text}
#nameDlg .row,#resetDlg .row{display:flex;gap:10px}#nameDlg button,#resetDlg button{font:inherit;font-weight:600;font-size:18px;border:2px solid #4A3428;border-radius:999px;padding:8px 18px;background:#fff;cursor:pointer}#nameDlg #nm-ok{background:#7CC86E;color:#fff}
</style>
<canvas id="cv"></canvas>
<div id="nameDlg" hidden><div class="panel"><h2>¿Cómo se llama quien juega?</h2><input id="nm-in" maxlength="20" autocomplete="off" placeholder="Nombre"><div class="row"><button id="nm-ok" type="button">Listo</button><button id="nm-x" type="button">Cancelar</button></div></div></div>
<div id="resetDlg" class="dlg" hidden><div class="panel"><h2>¿Empezar de nuevo?</h2><p style="margin:0">Se borra todo el progreso: letras rescatadas, estrellas, pegatinas, el álbum, el nombre y la edad. Las grabaciones de voz se conservan.</p><div class="row"><button id="rs-yes" type="button" style="background:#E2574C;color:#fff">Sí, borrar todo</button><button id="rs-no" type="button">No</button></div></div></div>
<div id="adult" hidden><div class="panel"><header><h2>Zona de adultos</h2><button id="a-close">Volver al juego</button></header><div class="body"></div></div></div>

  const fin=()=>{if(done)return;done=true;if(tok===sayTok)talking=false;if(MUS&&AC)MUS.gain.setTargetAtTime(S.vol.mus*.22,AC.currentTime,.2);if(cb&&my===sceneTok)cb()};
  const est=900+t.length*85/(o.rate||1);
  if(window.__fast){talking=true;setTimeout(fin,40);return}
  if(!('speechSynthesis' in window)||S.vol.voz<=0){talking=true;setTimeout(fin,Math.min(est,2500));return}
  try{speechSynthesis.cancel()}catch(e){}
  if(MUS&&AC)MUS.gain.setTargetAtTime(S.vol.mus*.07,AC.currentTime,.1);
  talking=true;
  setTimeout(()=>{ if(tok!==sayTok)return;
    const u=new SpeechSynthesisUtterance(t); if(VOICE){u.voice=VOICE;u.lang=VOICE.lang}else u.lang='es-AR';
    u.rate=o.rate||.88; u.pitch=o.pitch||1.12; u.volume=S.vol.voz; u.onend=fin; u.onerror=fin;
    speechSynthesis.speak(u);
  },60);
  setTimeout(fin,est+1500);
}

const REC={},RECB={};let IDB=null;
function idbReq(mode,fn){return new Promise(r=>{if(!IDB)return r(null);try{const tx=IDB.transaction('snd',mode),q=fn(tx.objectStore('snd'));tx.oncomplete=()=>r(q&&q.result);tx.onerror=()=>r(null)}catch(e){r(null)}})}
function idbOpen(){return new Promise(r=>{try{const q=indexedDB.open('letrilandia',1);q.onupgradeneeded=()=>q.result.createObjectStore('snd');q.onsuccess=()=>{IDB=q.result;r(IDB)};q.onerror=()=>r(null)}catch(e){r(null)}})}
async function loadRecs(){await idbOpen();if(!IDB)return;const keys=await idbReq('readonly',s=>s.getAllKeys())||[];
  for(const k of keys){const b=await idbReq('readonly',s=>s.get(k));if(b)RECB[k]=b}decodeRecs()}
function trimBuf(b){const d=b.getChannelData(0),th=.025;let a=0,z=d.length-1;while(a<d.length&&Math.abs(d[a])<th)a++;while(z>a&&Math.abs(d[z])<th)z--;
  a=Math.max(0,a-Math.floor(b.sampleRate*.03));z=Math.min(d.length,z+Math.floor(b.sampleRate*.08));if(z-a<200)return b;
  const o=AC.createBuffer(b.numberOfChannels,z-a,b.sampleRate);for(let c=0;c<b.numberOfChannels;c++)o.getChannelData(c).set(b.getChannelData(c).subarray(a,z));return o}
function decodeOne(k){if(!AC||!RECB[k])return Promise.resolve();return RECB[k].arrayBuffer().then(x=>new Promise((ok,no)=>AC.decodeAudioData(x,ok,no))).then(buf=>{REC[k]=trimBuf(buf)}).catch(()=>{delete REC[k]})}
function decodeRecs(){for(const k in RECB)if(!REC[k])decodeOne(k)}
async function saveRec(k,blob){RECB[k]=blob;delete REC[k];await idbReq('readwrite',s=>s.put(blob,k));initAudio();await decodeOne(k)}
async function delRec(k){delete RECB[k];delete REC[k];await idbReq('readwrite',s=>s.delete(k))}
loadRecs();
const _initAudio=initAudio; initAudio=function(){_initAudio();decodeRecs()};
function playRec(k,cb){const b=REC[k];let d=false;const my=sceneTok;try{speechSynthesis.cancel()}catch(e){}sayTok++;talking=true;
  const fin=()=>{if(d)return;d=true;talking=false;if(cb&&my===sceneTok)cb()};

const consPool=n=>{const r=CONS.filter(c=>S.rescued[c]);return shuffle(r.length>=n?r:[...r,...CONS.filter(c=>!S.rescued[c])].slice(0,Math.max(n,r.length))).slice(0,Math.max(n,Math.min(r.length,n+1)))};

SCENES.g_cartero=wrapGame('cartero','bosque',onDone=>{
  const nb=Math.min(3,((S.age||4)<=3?2:3)+(REP>=2?0:0)),Ls=consPool(nb).slice(0,nb),R=repR(6);
  const xs=nb===2?[700,1100]:[560,900,1240];
  const cards=shuffle(Ls.flatMap(L=>VINFO[L].words.map(w=>({w,L})))).slice(0,R);
  return {total:R,done:0,i:0,
    enter(){this.next(true)},
    next(first){this.c=cards[this.i];this.c.x=900;this.c.y=760;this.c.hx=900;this.c.hy=760;this.c.in=T;this.lock=false;this.inBox=0;
      later(300,()=>say(first?`¡Llegaron cartas${kid()}! Llevá cada carta al buzón de la letra con que empieza. ${say_w(this.c.w)}.`:say_w(this.c.w)))},
    prompt(){sayMix([`${say_w(this.c.w)}. ¿Con qué letra empieza ${say_w(this.c.w)}?`])},
    hint(){const i=Ls.indexOf(this.c.L);return this.inBox?null:{x:this.c.x,y:this.c.y,r:110,dx:xs[i]-this.c.x,dy:330-this.c.y}},
    down(x,y){if(this.lock)return;const c=this.c;if(Math.abs(x-c.x)<110&&Math.abs(y-c.y)<100){drag={sx:x,sy:y,ox:c.x-x,oy:c.y-y,moved:false};SFX.tap();return}
      const b=xs.findIndex(bx=>Math.abs(x-bx)<120&&y<480);if(b>=0){sayMix(['El buzón de la',snd(Ls[b])]);return}SFX.tap();sparkles(x,y,3)},
    move(x,y){if(!drag)return;this.c.x=x+drag.ox;this.c.y=y+drag.oy;if(dist(x,y,drag.sx,drag.sy)>18)drag.moved=true},
    up(){if(!drag)return;const m=drag.moved;drag=null;const c=this.c;
      if(!m){say(say_w(c.w));c.x=c.hx;c.y=c.hy;return}
      const b=xs.findIndex(bx=>Math.abs(c.x-bx)<170&&c.y<560);
      if(b<0){this.fly(c.hx,c.hy);return}
      if(Ls[b]===c.L){this.lock=true;this.fly(xs[b],300,()=>{this.inBox=T;SFX.good();burst(xs[b],300,26);rec(c.L,true);this.done++;scene.starPop=T;
          sayMix([`¡${say_w(c.w)}! Empieza con`,snd(c.L),Math.random()<.4?nm('. ¡Muy bien, #!','.'):'.'],()=>later(400,()=>{this.i++;if(this.i>=R)onDone();else this.next()}))})}
      else{SFX.bad();rec(c.L,false);this.fly(c.hx,c.hy);sayMix([`${say_w(c.w)} no empieza con`,snd(Ls[b]),'.'])}},
    fly(tx,ty,then){const c=this.c;c.fl={fx:c.x,fy:c.y,tx,ty,t0:T,then}},
    update(){const c=this.c;if(c&&c.fl){const k=clamp((T-c.fl.t0)/.4,0,1);c.x=lerp(c.fl.fx,c.fl.tx,easeOut(k));c.y=lerp(c.fl.fy,c.fl.ty,easeOut(k));if(k>=1){const t=c.fl.then;c.fl=null;t&&t()}}},
    draw(){bosqueBg();xs.forEach((x,i)=>drawMailbox(x,330,1,Ls[i]));
      const c=this.c;if(!c)return;const a=this.inBox?Math.max(0,1-(T-this.inBox)*3):clamp((T-c.in)*3,0,1);
      ctx.save();ctx.globalAlpha=a;ctx.translate(c.x,c.y);ctx.rotate(Math.sin(T*2)*.03);card(-110,-90,220,180,'#fff',7,20);ctx.beginPath();ctx.moveTo(-110,-90);ctx.lineTo(0,-20);ctx.lineTo(110,-90);ctx.lineWidth=4;ctx.strokeStyle='#E4D3B8';ctx.stroke();pic(c.w,0,10,140);ctx.restore();
    }
  };
},'bosque');

SCENES.g_memoria=wrapGame('memoria','bosque',onDone=>{
  const B=2, np=Math.min(4,((S.age||4)<=3?2:3)+(REP>=1?1:0));
  return {total:B*np,done:0,b:0,
    enter(){this.board()},
    board(){const Ls=consPool(np).slice(0,np);
      const cs=shuffle(Ls.flatMap(L=>[{L,kind:'l'},{L,kind:'p',w:REP>=1?pick(VINFO[L].words):VINFO[L].friend}]));
      const cols=np<=2?4:np===3?3:4,rows=Math.ceil(cs.length/cols),cw=190,ch=220,gx=40;
      cs.forEach((c,i)=>{const r=i/cols|0,cc=i%cols,n=Math.min(cols,cs.length-r*cols);c.x=860-(n-1)*(cw+gx)/2+cc*(cw+gx);c.y=rows===2?(r?640:370):(r===0?260:r===1?500:740);c.up=0;c.m=0;c.fl=-9});
      this.cs=cs;this.open=[];this.lock=false;
      later(300,()=>say(this.b===0?nm('#, ¡vamos a jugar a la memoria! ','Juego de memoria. ')+'Da vuelta dos cartas: una letra y su dibujo.':'¡Otra vez! Buscá las parejas.'))},
    prompt(){say('Da vuelta dos cartas. Buscá la letra y el dibujo que empieza con esa letra.')},
    hint(){const o=this.open[0];const t=o?this.cs.find(c=>c!==o&&c.L===o.L&&!c.m):this.cs.find(c=>!c.m&&!c.up);return t?{x:t.x,y:t.y,r:120}:null},
    down(x,y){if(this.lock)return;const c=this.cs.find(c=>!c.m&&Math.abs(x-c.x)<95&&Math.abs(y-c.y)<110);if(!c||c.up){SFX.tap();return}
      c.up=1;c.fl=T;SFX.tap();this.open.push(c);
      if(c.kind==='l')sayMix([snd(c.L)]);else say(say_w(c.w));
      if(this.open.length===2){const [a,b]=this.open;this.lock=true;
        if(a.L===b.L&&a.kind!==b.kind){const w=a.w||b.w;later(800,()=>{SFX.good();burst((a.x+b.x)/2,(a.y+b.y)/2,30);a.m=T;b.m=T;rec(a.L,true);this.done++;scene.starPop=T;
            sayMix([`¡${say_w(w)} empieza con`,snd(a.L),'!'],()=>{this.open=[];this.lock=false;if(this.cs.every(c=>c.m)){this.b++;if(this.b>=B)later(400,onDone);else later(600,()=>this.board())}})})}
        else later(1300,()=>{SFX.bad();rec(a.L,false);a.up=0;b.up=0;a.fl=T;b.fl=T;this.open=[];this.lock=false})}},
    draw(){bosqueBg();
      for(const c of this.cs){if(c.m&&T-c.m>.6)continue;const k=clamp((T-c.fl)*4,0,1),sx=Math.abs(Math.cos(k*PI)),face=k>.5?c.up:!c.up;
        ctx.save();ctx.translate(c.x,c.y);if(c.m){const q=(T-c.m)/.6;ctx.globalAlpha=1-q;ctx.scale(1+q*.3,1+q*.3)}ctx.scale(Math.max(.05,sx),1);
        if(!face){card(-90,-105,180,210,'#9B8AD9',7,24);star(0,0,40,'#FFC93C',4)}
        else{card(-90,-105,180,210,'#fff',7,24);if(c.kind==='l')letrin(lt(c.L),0,60,lt(c.L).length>1?100:150,VINFO[c.L].col);else pic(c.w,0,0,150)}
        ctx.restore()}
    }
  };
},'bosque');

function PaintLetter(ch,colr,onDone){
  const G=document.createElement('canvas');G.width=400;G.height=225;const g=G.getContext('2d');
  g.font=`700 150px ${LF}`;g.textAlign='center';g.textBaseline='alphabetic';g.fillStyle='#000';g.lineJoin='round';g.lineWidth=7;g.strokeStyle='#000';g.fillText(ch,200,180);g.strokeText(ch,200,180);
  const gd=g.getImageData(0,0,400,225).data;let tot=0;for(let i=3;i<gd.length;i+=4)if(gd[i]>100)tot++;
  const P=document.createElement('canvas');P.width=400;P.height=225;const p=P.getContext('2d');p.lineCap='round';p.lineJoin='round';p.strokeStyle='#000';p.fillStyle='#000';
  const C=document.createElement('canvas');C.width=400;C.height=225;const c=C.getContext('2d');
  const thr={3:.5,4:.62,5:.7}[S.age||4], br=(S.age||4)<=3?15:12;
  return {cov:0,on:false,last:null,n:0,fin:0,
    down(x,y){if(this.fin)return;this.on=true;this.last=[x/4,y/4];p.beginPath();p.arc(x/4,y/4,br,0,PI*2);p.fill();this.check()},
    move(x,y){if(!this.on||this.fin)return;const [a,b]=this.last;p.beginPath();p.moveTo(a,b);p.lineTo(x/4,y/4);p.lineWidth=br*2;p.stroke();this.last=[x/4,y/4];if(Math.random()<.25)sparkles(x,y,1);if(++this.n%6===0){this.check();SFX.trace(this.cov)}},
    up(){this.on=false;this.check()},
    check(){const pd=p.getImageData(0,0,400,225).data;let k=0;for(let i=3;i<pd.length;i+=4)if(pd[i]>100&&gd[i]>100)k++;this.cov=k/tot;
      if(this.cov>=thr&&!this.fin){this.fin=T;p.fillRect(0,0,400,225);SFX.good();burst(800,480,40);later(900,onDone)}},
    draw(){
      text(ch,800,720,600,'#EFE6D8',{f:LF});ctx.save();ctx.setLineDash([4,22]);ctx.lineWidth=7;ctx.strokeStyle='#B8B0A6';ctx.lineCap='round';ctx.font=`700 600px ${LF}`;ctx.textAlign='center';ctx.strokeText(ch,800,720);ctx.restore();
      c.globalCompositeOperation='source-over';c.clearRect(0,0,400,225);c.drawImage(P,0,0);c.globalCompositeOperation='source-in';c.fillStyle=colr;c.fillRect(0,0,400,225);c.globalCompositeOperation='destination-in';c.drawImage(G,0,0);
      ctx.drawImage(C,0,0,1600,900);
      if(this.fin){ctx.save();ctx.font=`700 600px ${LF}`;ctx.textAlign='center';ctx.lineWidth=14;ctx.strokeStyle=K;ctx.strokeText(ch,800,720);ctx.restore()}
      // barra
      card(1300,380,40,300,'#fff',5,20);const h=280*clamp(this.cov/thr,0,1);card(1305,675-h,30,h,colr,0,15);star(1320,360,26,this.cov>=thr?'#FFC93C':'#EADFCF',4);
    },
    hint(){return null}
  };
}
const NCOL=['#FF8A7A','#FFA94D','#F2B035','#7CC86E','#3FC1B0','#4FB8E0','#5B8DEF','#9B8AD9','#F58BB4'];
SCENES.nombre={music:'game',
  enter(){this.mode=S.name?'see':'ask';this.tap={};this.jump={};this.pi=0;this.pl=null;
    if(this.mode==='ask')later(300,()=>say('¿Cómo te llamás? Pedile a un grande que escriba tu nombre.'));
    else later(300,()=>say(`¡Este es tu nombre! ${S.name}. Tocá cada letra para escucharla.`))},
  chars(){const n=S.name.trim(),c=S.caseMode==='upper'?n.toUpperCase():n[0].toUpperCase()+n.slice(1).toLowerCase();return [...c]},
  layout(){const cs=this.chars(),n=cs.length,sz=Math.min(230,1200/n*1.25),w=sz*.72;return cs.map((ch,i)=>({ch,x:800-(n-1)*w/2+i*w,y:this.mode==='paint'?230:470,sz:this.mode==='paint'?Math.min(130,sz*.6):sz,i}))},
  letterSay(ch){const u=norm(ch).toUpperCase();if(VINFO[u])sayMix([snd(u),`, de ${say_w(VINFO[u].friend)}`]);else if(/[A-ZÑ]/.test(u))say(u);},
  prompt(){if(this.mode==='ask')say('Pedile a un grande que escriba tu nombre.');else if(this.mode==='see')say('Tocá cada letra de tu nombre.');else if(this.mode==='paint')say('Pintá la letra con el dedo.')},
  hint(){if(this.mode==='ask')return{x:800,y:600,r:150};if(this.mode==='see'){const l=this.layout().find(l=>!this.tap[l.i]&&/\p{L}/u.test(l.ch));return l?{x:l.x,y:l.y-l.sz*.3,r:l.sz*.45}:{x:1400,y:790,r:90}}return null},
  startPaint(){this.mode='paint';const L=this.layout().filter(l=>/\p{L}/u.test(l.ch));this.order=L.map(l=>l.i);this.pi=0;this.paintNext(true)},
  paintNext(first){const l=this.layout()[this.order[this.pi]];this.pl=PaintLetter(l.ch,NCOL[this.pi%NCOL.length],()=>{this.pi++;if(this.pi>=this.order.length)this.end();else this.paintNext()});
    this.letterSay(l.ch);if(first)later(1800,()=>say('Pintá la letra con el dedo hasta llenarla.'))},
  end(){this.mode='end';this.endT=T;SFX.tada();burst(800,400,90);S.games.nombre=(S.games.nombre||0)+1;save();giveSticker();say(`¡${S.name}! ¡Pintaste tu nombre! ¡Muy bien!`)},
  down(x,y){
    if(dist(x,y,HOME.x,HOME.y)<70){SFX.tap();go('map');return}

      for(const l of this.layout())if(Math.abs(x-l.x)<l.sz*.38&&y>l.y-l.sz*.8&&y<l.y+40){this.tap[l.i]=1;this.jump[l.i]=T;SFX.boing();this.letterSay(l.ch);
        if(this.layout().every(q=>this.tap[q.i]||!/\p{L}/u.test(q.ch))&&!this.allT){this.allT=1;later(2200,()=>say(praise()+' Ahora tocá el pincel para pintar tu nombre.'))}return}

    if(this.mode==='paint'&&this.pl)this.pl.down(x,y);
    if(this.mode==='end'){this.endT=T;say(S.name)}
  },
  move(x,y){if(this.mode==='paint'&&this.pl)this.pl.move(x,y)},up(x,y){if(this.mode==='paint'&&this.pl)this.pl.up(x,y)},
  draw(){sky('#FFF0C2','#FFE0DA');for(let i=0;i<10;i++)star((i*173+60)%1600,(i*251+80)%900,10+i%3*5,'#FFE08A',0);
    if(this.mode==='ask'){text('Mi nombre',800,200,80,K);drawLupi(680,240,220,{bubble:false});card(580,530,440,140,'#7CC86E',7,70);text('Escribir el nombre',800,618,46,'#fff',{st:0});text('(lo escribe un grande)',800,720,34,'#7A6252');}
    else{const L=this.layout();
      L.forEach(l=>{const j=this.jump[l.i]&&T-this.jump[l.i]<.5?Math.sin((T-this.jump[l.i])*2*PI)*40:0,cur=this.mode==='paint'&&this.order&&this.order[this.pi]===l.i,done=this.mode==='end'||(this.mode==='paint'&&this.order.indexOf(l.i)<this.pi);
        const col=this.mode==='see'?(this.tap[l.i]?NCOL[l.i%NCOL.length]:'#fff'):done||cur?NCOL[Math.max(0,this.order?this.order.indexOf(l.i):l.i)%NCOL.length]:'#fff';
        const dy=this.mode==='end'?Math.sin(T*6+l.i)*20:0;

        else{text(l.ch,l.x,l.y,l.sz,col,{f:LF,st:l.sz*.06});if(cur){ctx.beginPath();ctx.moveTo(l.x-l.sz*.3,l.y+20);ctx.lineTo(l.x+l.sz*.3,l.y+20);ctx.lineWidth=8;ctx.strokeStyle='#FF8A7A';ctx.lineCap='round';ctx.stroke()}}});
      if(this.mode==='see'){circ(1400,790,80,'#fff',7);ctx.save();ctx.translate(1400,790);ctx.rotate(.7);card(-14,-60,28,90,'#F58BB4',5,10);ctx.beginPath();ctx.moveTo(-14,30);ctx.lineTo(0,62);ctx.lineTo(14,30);fillStroke('#FFE0C2',5);ctx.restore()}
      if(this.mode==='paint'&&this.pl)this.pl.draw();
      if(this.mode==='end'){text('¡Muy bien!',800,760,80,'#FF8A7A',{st:8,sc:'#fff'})}}

SCENES.album={music:'book',
  enter(){this.pg=0;later(300,()=>say(Object.keys(S.stk).length?'Este es tu álbum. Arrastrá las pegatinas a la página.':'Todavía no tenés pegatinas. ¡Las ganás terminando juegos!'))},
  prompt(){say('Arrastrá una pegatina de abajo a la página.')},
  avail(){const pl={};for(const a of S.album)pl[a.k]=(pl[a.k]||0)+1;return Object.keys(S.stk).filter(k=>S.stk[k]-(pl[k]||0)>0).map(k=>({k,n:S.stk[k]-(pl[k]||0)}))},
  tray(){const av=this.avail(),per=8,pages=Math.max(1,Math.ceil(av.length/per));this.pg=clamp(this.pg,0,pages-1);return{items:av.slice(this.pg*per,this.pg*per+per).map((a,i)=>({...a,x:420+i*135,y:800})),pages}},
  hint(){const t=this.tray();return t.items[0]&&!S.album.length?{x:t.items[0].x,y:t.items[0].y,r:70,dx:800-t.items[0].x,dy:-380}:null},
  down(x,y){
    if(dist(x,y,HOME.x,HOME.y)<70){SFX.tap();go('map');return}
    const t=this.tray();
    if(t.pages>1&&dist(x,y,320,800)<55){this.pg=(this.pg-1+t.pages)%t.pages;SFX.tap();return}
    if(t.pages>1&&dist(x,y,1500,800)<55){this.pg=(this.pg+1)%t.pages;SFX.tap();return}
    for(let i=S.album.length-1;i>=0;i--){const a=S.album[i];if(dist(x,y,a.x,a.y)<a.s*.55){S.album.splice(i,1);S.album.push(a);drag={a,ox:a.x-x,oy:a.y-y};SFX.tap();return}}
    const it=t.items.find(it=>dist(x,y,it.x,it.y)<65);
    if(it){const a={k:it.k,x,y,s:150,r:rnd(-.25,.25)};S.album.push(a);drag={a,ox:0,oy:0,isNew:1};SFX.pop();if(WORDS[it.k])say(say_w(it.k));return}
    SFX.tap();sparkles(x,y,3);
  },
  move(x,y){if(drag&&drag.a){drag.a.x=x+drag.ox;drag.a.y=y+drag.oy}},
  up(){if(!drag||!drag.a)return;const a=drag.a;drag=null;
    if(dist(a.x,a.y,150,800)<90||a.y>700){S.album.splice(S.album.indexOf(a),1);SFX.whoosh()}
    else{a.x=clamp(a.x,240,1440);a.y=clamp(a.y,150,640);SFX.pop();sparkles(a.x,a.y,6)}save()},
  draw(){sky('#EEE9FB','#DCD3F7');card(200,100,1280,580,'#FFFBF2',8,30);ctx.save();ctx.setLineDash([10,14]);rr(225,125,1230,530,20);ctx.lineWidth=4;ctx.strokeStyle='#E4D3B8';ctx.stroke();ctx.restore();
    text(S.name?'Álbum de '+S.name:'Mi álbum',840,80,46,'#9B8AD9',{st:6,sc:'#fff'});
    if(!S.album.length)text('Arrastrá tus pegatinas acá',840,410,44,'#D9CFC0');
    for(const a of S.album)drawSticker(a.k,a.x,a.y,a.s,a.r);
    card(250,720,1300,160,'#fff',6,40);
    const t=this.tray();
    if(!t.items.length)text(Object.keys(S.stk).length?'¡Ya pegaste todas!':'Ganá pegatinas jugando',900,815,36,'#9C9389');
    for(const it of t.items){drawSticker(it.k,it.x,it.y,110);if(it.n>1){circ(it.x+42,it.y-42,20,'#FF8A7A',4);text(String(it.n),it.x+42,it.y-32,26,'#fff')}}
    if(t.pages>1){for(const [x,d] of[[320,-1],[1500,1]]){circ(x,800,44,'#fff',5);ctx.beginPath();ctx.moveTo(x-d*12,780);ctx.lineTo(x+d*14,800);ctx.lineTo(x-d*12,820);ctx.closePath();fillStroke(K,0)}}
    // tacho
    ctx.save();ctx.translate(150,800);card(-45,-40,90,90,'#B9C3D6',5,14);card(-55,-55,110,18,'#9FB0C9',5,8);for(const xx of[-20,0,20]){ctx.beginPath();ctx.moveTo(xx,-25);ctx.lineTo(xx,35);ctx.lineWidth=4;ctx.strokeStyle=K;ctx.stroke()}ctx.restore();
    drawHome();
  }
};

/* ---------- CANCIÓN DE LAS LETRAS ---------- */
const MELO=[0,0,7,7,9,9,7,5,5,4,4,2,2,0,7,7,5,5,4,4,2];
SCENES.cancion={music:null,
  enter(){this.list=LETTERS.filter(l=>S.rescued[l]);this.j={};this.playing=false;this.cur=null;
    later(300,()=>say(this.list.length?'¡La canción de las letras! Tocá el botón para cantar, o tocá una letra.':'Todavía no rescataste letras. ¡Cuando las rescates, van a cantar acá!'))},
  prompt(){say('Tocá el botón para cantar con las letras.')},
  pos(){const n=this.list.length,per=n>7?Math.ceil(n/2):n,sz=n>7?150:180;return this.list.map((L,i)=>{const r=i<per?0:1,k=r?i-per:i,m=r?n-per:per;return{L,x:800-(m-1)*(sz*.95)/2+k*sz*.95,y:n>7?(r?640:420):520,sz}})},
  hint(){return this.playing||!this.list.length?null:{x:800,y:810,r:70}},
  play(){this.playing=true;this.k=0;this.step()},
  step(){if(this.k>=this.list.length){this.playing=false;this.cur=null;SFX.tada();burst(800,400,80);for(const L of this.list)this.j[L]=T;say(`¡Bravo${kid()}! ¡Qué lindo cantan las letras!`);return}
    const L=this.list[this.k];this.cur=L;this.j[L]=T;const f=440*Math.pow(2,(60+MELO[this.k%MELO.length]-69)/12);tone(f,.5,'triangle',.4);tone(f/2,.6,'sine',.25);
    sayMix([snd(L)],()=>later(220,()=>{this.k++;this.step()}),{rate:.9})},
  down(x,y){if(dist(x,y,HOME.x,HOME.y)<70){SFX.tap();go('map');return}
    if(dist(x,y,800,810)<80&&this.list.length&&!this.playing){SFX.pop();this.play();return}
    for(const p of this.pos())if(Math.abs(x-p.x)<p.sz*.42&&Math.abs(y-p.y+p.sz*.3)<p.sz*.5){this.j[p.L]=T;tone(660,.2,'triangle',.3);sayMix([snd(p.L),`, de ${say_w(VINFO[p.L].friend)}`]);return}
    SFX.tap();sparkles(x,y,3)},
  draw(){sky('#3B2E6E','#5B4A9A');
    for(let i=0;i<20;i++){ctx.globalAlpha=.4+.4*Math.sin(T*2+i);star((i*211)%1600,(i*97)%260+20,6+i%3*3,'#FFE08A',0)}ctx.globalAlpha=1;
    ctx.fillStyle='#C84B5A';for(const s of[-1,1]){ctx.beginPath();const x0=s<0?0:1600;ctx.moveTo(x0,0);ctx.lineTo(x0+s*-220,0);ctx.quadraticCurveTo(x0+s*-120,450,x0+s*-200,900);ctx.lineTo(x0,900);ctx.closePath();fillStroke('#C84B5A',6)}
    ctx.fillStyle='#A86B43';ctx.fillRect(0,720,1600,180);ctx.strokeStyle=K;ctx.lineWidth=6;ctx.strokeRect(-10,720,1620,200);
    if(this.cur){const p=this.pos().find(p=>p.L===this.cur);if(p){ctx.save();ctx.globalAlpha=.25;ctx.beginPath();ctx.moveTo(p.x-30,0);ctx.lineTo(p.x+30,0);ctx.lineTo(p.x+p.sz*.6,p.y+20);ctx.lineTo(p.x-p.sz*.6,p.y+20);ctx.closePath();ctx.fillStyle='#FFF3B0';ctx.fill();ctx.restore()}}
    if(!this.list.length){text('?',800,520,200,'rgba(255,255,255,.4)');}
    for(const [i,p] of this.pos().entries()){const jk=this.j[p.L]?T-this.j[p.L]:9,jy=jk<.5?Math.sin(jk*2*PI)*60:0,dance=this.playing?Math.sin(T*6+i)*.08:0;
      letrin(lt(p.L),p.x,p.y-jy,lt(p.L).length>1?p.sz*.75:p.sz,VINFO[p.L].col,{rot:dance,ph:i})}
    if(this.list.length){const pu=this.playing?1:1+Math.sin(T*4)*.06;ctx.save();ctx.translate(800,810);ctx.scale(pu,pu);circ(0,0,64,this.playing?'#B8B0A6':'#7CC86E',7);text('♪',-4,24,70,'#fff');ctx.restore()}
    drawHome();
  }
};

/* ---------- GRABADOR (zona de adultos) ---------- */
const SYL=CONS.flatMap(c=>VOW.map(v=>c+v));
function recorderHTML(){
  const row=(k,h)=>`<div class="rec${RECB[k]?' has':''}" data-k="${k}"><b>${k}</b><small>${h||''}</small><button class="r" type="button">● Grabar</button><button class="p" type="button" ${RECB[k]?'':'disabled'}>▶</button><label class="up" title="Subir un audio">⬆<input type="file" accept="audio/*"></label><button class="x" type="button" ${RECB[k]?'':'disabled'}>✕</button></div>`;
  const n=Object.keys(RECB).length;
  return `<section><h3>Grabar los sonidos de las letras</h3>
   <p class="note">Grabá cómo <b>suena</b> cada letra ("mmm", no "eme") y las sílabas. El juego usa tu grabación en lugar de la voz del aparato. A los chicos les encanta oír una voz conocida. Hay ${n} grabados.</p>
   <p class="note" id="mic-msg"></p>
   <h4>Vocales</h4><div class="recs">${VOW.map(v=>row(v,'"'+VINFO[v].hint+'"')).join('')}</div>
   <h4>Consonantes</h4><div class="recs">${CONS.map(v=>row(v,'"'+VINFO[v].hint+'"')).join('')}</div>
   <details><summary>Sílabas (${SYL.length})</summary><div class="recs">${SYL.map(s=>row(s,'')).join('')}</div></details></section>`;
}
let micStream=null,mrec=null;
function wireRecorder(el){
  const msg=el.querySelector('#mic-msg');
  const mark=(r,has)=>{r.classList.toggle('has',has);r.querySelector('.p').disabled=!has;r.querySelector('.x').disabled=!has};
  el.querySelectorAll('.rec').forEach(r=>{const k=r.dataset.k,bR=r.querySelector('.r');
    bR.onclick=async()=>{
      if(mrec&&mrec.state==='recording'){mrec.stop();return}
      try{if(!micStream)micStream=await navigator.mediaDevices.getUserMedia({audio:true})}
      catch(e){msg.textContent='Este navegador no deja usar el micrófono acá. Podés grabar con el celular (notas de voz) y usar el botón ⬆ para subir el audio, o usar la versión instalable del juego, donde el micrófono sí funciona.';return}
      const chunks=[];try{mrec=new MediaRecorder(micStream)}catch(e){msg.textContent='Este navegador no puede grabar audio. Usá el botón ⬆ para subir un audio.';return}
      mrec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
      mrec.onstop=async()=>{bR.textContent='● Grabar';r.classList.remove('on');const b=new Blob(chunks,{type:mrec.mimeType||'audio/webm'});await saveRec(k,b);mark(r,true);if(REC[k])playRec(k)};
      mrec.start();bR.textContent='■ Parar';r.classList.add('on');setTimeout(()=>{if(mrec&&mrec.state==='recording')mrec.stop()},2500)};
    r.querySelector('.p').onclick=()=>{initAudio();if(REC[k])playRec(k);else decodeOne(k).then(()=>REC[k]&&playRec(k))};
    r.querySelector('.x').onclick=async()=>{await delRec(k);mark(r,false)};
    r.querySelector('input').onchange=async e=>{const f=e.target.files[0];if(!f)return;await saveRec(k,f);if(REC[k]){mark(r,true);playRec(k)}else{msg.textContent='No pude leer ese audio. Probá con otro formato (mp3, m4a, wav).';await delRec(k)}};
  });
}
